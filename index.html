<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#183a32"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>घरहिशोब · HomeLedger</title>
<style>
:root{--bg:#f4f6f2;--card:#fff;--ink:#172a24;--muted:#68756e;--green:#1c5b45;--green2:#e4f1e9;--line:#e2e8e2;--orange:#f3a54a;--shadow:0 8px 24px #173c2b0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:115px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--green);color:#fff;font-weight:650}button.secondary{background:#edf2ee;color:var(--green);border:1px solid var(--line)}button.danger{background:#fff0ee;color:#a33b2e}button.small{padding:7px 10px;font-size:13px}header{background:linear-gradient(135deg,#173b32,#28664d);color:white;padding:20px 18px 24px;border-radius:0 0 24px 24px}header .top{display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{font-size:23px;margin:0}header p{margin:5px 0 0;color:#d6e6dd;font-size:13px}.monthbar{display:flex;gap:10px;align-items:center;margin:16px 0 0}.monthbar input{background:#ffffff18;color:#fff;border:1px solid #ffffff35;padding:10px;border-radius:10px;flex:1}.monthbar button{background:#ffffff18;border:1px solid #ffffff35}.wrap{max-width:850px;margin:auto;padding:14px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.stat{background:var(--card);border-radius:16px;padding:15px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:22px;margin-top:5px}.stat.total{background:var(--green);color:white}.stat.total .label{color:#d9e9e1}.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section-title h2{font-size:17px;margin:0}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 10px;text-align:left;min-height:95px;color:var(--ink);box-shadow:var(--shadow)}.tile .emoji{font-size:23px;display:block}.tile b{display:block;margin:5px 0 2px}.tile small{color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;box-shadow:var(--shadow)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfcfb;color:var(--ink)}.field textarea{min-height:70px}.list{display:flex;flex-direction:column;gap:8px}.entry{display:flex;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.entry .sub{font-size:12px;color:var(--muted);margin-top:3px}.entry .amount{font-weight:750;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:22px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 9px}.tabs button{white-space:nowrap;background:#e8eee9;color:#345347}.tabs button.active{background:var(--green);color:#fff}.bottom{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:16px;margin:0 10px;padding:9px 10px;display:flex;justify-content:center;gap:5px;z-index:50;box-shadow:0 8px 24px #173c2b20;}.bottom button{flex:1;background:transparent;color:var(--muted);padding:8px 4px;font-size:12px}.bottom button.active{color:var(--green);background:var(--green2)}.bottom span{display:block;font-size:18px}.hidden{display:none!important}.pill{background:var(--green2);color:var(--green);border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap}.divider{height:1px;background:var(--line);margin:12px 0}.hint{font-size:12px;color:var(--muted)}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left}.table th{color:var(--muted)}.report-head{text-align:center}.report-head h2{margin-bottom:3px}.report-head p{color:var(--muted)}@media(min-width:650px){.cards{grid-template-columns:repeat(4,1fr)}.tiles{grid-template-columns:repeat(4,1fr)}}@media print{body{background:white;padding:0}header,.bottom,.no-print,button{display:none!important}.wrap{padding:0}.panel,.stat{box-shadow:none;border:0}.print-only{display:block!important}}
.bottom{max-width:850px;margin-left:auto;margin-right:auto;left:10px;right:10px}.bottom button{min-height:48px}@media(min-width:650px){.bottom{left:calc(50% - 425px);right:calc(50% - 425px)}}

#lockScreen{position:fixed;inset:0;z-index:9999;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;overflow:auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
#lockScreen .lk-box{text-align:center;width:100%;max-width:320px;padding:20px 0}
#lkPic{font-size:64px;line-height:1;margin-bottom:8px}
#lkPic img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #fff}
#lkTitle{margin:8px 0 12px;font-size:18px;color:#fff}
#lkDots{display:flex;justify-content:center;gap:14px;margin:8px 0}
#lkDots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}
#lkDots i.on{background:#fff}
#lkDots.shake{animation:lkshake .4s}
@keyframes lkshake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#lkMsg{min-height:20px;font-size:13px;color:#ffd9a0;margin:6px 0}
#lkPad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center;margin-top:6px}
#lkPad button{width:68px;height:68px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:24px;padding:0;min-height:0}
#lkPad button:active{background:#ffffff55}
#lkCancel{margin-top:14px}
</style></head><body>
<div id="lockScreen" class="hidden"><div class="lk-box"><div id="lkPic"></div><h2 id="lkTitle"></h2><div id="lkDots"></div><p id="lkMsg"></p><div id="lkPad"></div><button class="secondary small hidden" id="lkCancel" onclick="hidePad()"></button></div></div>
<header><div class="top"><div><h1>🏠 <span id="brand">घरहिशोब</span></h1><p id="subtitle">एक घर · एक हिशोब · स्पष्ट नियोजन</p></div><div style="display:flex;gap:6px"><button class="secondary small hidden" id="installBtn" onclick="installApp()">Install</button><button class="secondary small" id="langBtn" onclick="toggleLang()">English</button></div></div><div class="monthbar"><input type="month" id="monthPicker"><button onclick="goCurrentMonth()" id="currentBtn">चालू महिना</button></div></header>
<div class="wrap"><main id="main"></main></div>
<nav class="bottom" id="bottomNav"></nav>
<script>
const KEY='homeledger_v1';let lang='mr',month=new Date().toISOString().slice(0,7),tab='home';const defaults={members:['घर'],budget:0,groceries:[],milk:[],gas:[],paper:[],daily:[],other:[],settings:{milkRate:60,milkQty:1,paperRate:6,paperDays:30}};let db=load(),editMode=false,gearHoldTimer=null,gearHoldTriggered=false;function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{return structuredClone(defaults)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}const tr=(mr,en)=>lang==='mr'?mr:en;const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const monthName=m=>new Date(m+'-01T00:00:00').toLocaleDateString(lang==='mr'?'mr-IN':'en-IN',{month:'long',year:'numeric'});function inMonth(d){return (d||'').slice(0,7)===month}function sums(arr){return arr.filter(x=>inMonth(x.date)).reduce((s,x)=>s+Number(x.amount||x.total||0),0)}function setMonth(v){month=v;document.getElementById('monthPicker').value=v;render()}function goCurrentMonth(){setMonth(new Date().toISOString().slice(0,7))}document.getElementById('monthPicker').value=month;document.getElementById('monthPicker').onchange=e=>setMonth(e.target.value);function toggleLang(){lang=lang==='mr'?'en':'mr';document.getElementById('langBtn').textContent=lang==='mr'?'English':'मराठी';render()}
const categories=[['home','🏠','Dashboard'],['grocery','🛒','Groceries'],['milk','🥛','Milk'],['gas','🔥','Gas'],['paper','📰','Newspaper'],['daily','💸','Daily Expense'],['other','🏡','Other'],['reports','📊','Reports'],['history','📅','History'],['settings','⚙️','Settings']];function titleOf(t){return tr(({home:'घराचा आढावा',grocery:'किराणा बाजार',milk:'दूध',gas:'सिलेंडर',paper:'दैनिक पेपर',daily:'रोजचा खर्च',other:'इतर घरखर्च',reports:'रिपोर्ट',history:'मासिक इतिहास',settings:'सेटिंग्स'})[t],({home:'Home Dashboard',grocery:'Groceries',milk:'Milk',gas:'Gas Cylinder',paper:'Newspaper',daily:'Daily Expenses',other:'Other Household',reports:'Reports',history:'Monthly History',settings:'Settings'})[t])}function nav(){document.getElementById('bottomNav').innerHTML=categories.filter(x=>['home','reports','history','settings'].includes(x[0])).map(x=>x[0]==='settings'?`<button id="settingsNav" class="${tab==='settings'?'active':''}" onclick="openTab('settings')" onpointerdown="startGearHold(event)" onpointerup="cancelGearHold()" onpointerleave="cancelGearHold()" oncontextmenu="event.preventDefault()"><span>${editMode?'🔓':'🔒'} ⚙️</span>${tr('सेटिंग','Settings')}<small>${editMode?tr('Edit सुरू','Editing ON'):tr('Long press','Long press')}</small></button>`:`<button class="${tab===x[0]?'active':''}" onclick="openTab('${x[0]}')"><span>${x[1]}</span>${tr(({home:'घर',reports:'रिपोर्ट',history:'इतिहास'})[x[0]],({home:'Home',reports:'Reports',history:'History'})[x[0]])}</button>`).join('')}function startGearHold(e){gearHoldTriggered=false;gearHoldTimer=setTimeout(()=>{gearHoldTriggered=true;editMode=!editMode;tab='settings';render();alert(editMode?tr('सेटिंग एडिट सुरू झाले. सेव्ह केल्यावर लॉक होईल.','Settings unlocked. Saving will lock again.'):tr('सेटिंग लॉक झाले. पुन्हा बदलण्यासाठी Settings वर Long Press करा.','Settings locked. Long press Settings to edit again.'))},750)}function cancelGearHold(){if(gearHoldTimer){clearTimeout(gearHoldTimer);gearHoldTimer=null}}function openTab(t){tab=t;render()}function render(){nav();let mTotal=sums(db.groceries)+sums(db.milk)+sums(db.gas)+sums(db.paper)+sums(db.daily)+sums(db.other);const main=document.getElementById('main');if(tab==='home')main.innerHTML=dashboard(mTotal);else if(tab==='grocery')main.innerHTML=grocery();else if(tab==='milk')main.innerHTML=milk();else if(tab==='gas')main.innerHTML=gas();else if(tab==='paper')main.innerHTML=paper();else if(tab==='daily')main.innerHTML=expenseForm('daily');else if(tab==='other')main.innerHTML=expenseForm('other');else if(tab==='reports')main.innerHTML=reports(mTotal);else if(tab==='history')main.innerHTML=historyPage();else if(tab==='settings')main.innerHTML=settings();}function dashboard(total){let icons=[['grocery','🛒','किराणा',sums(db.groceries)],['milk','🥛','दूध',sums(db.milk)],['gas','🔥','सिलेंडर',sums(db.gas)],['paper','📰','पेपर',sums(db.paper)],['daily','💸','रोजचा खर्च',sums(db.daily)],['other','🏡','इतर खर्च',sums(db.other)]];return `<div class="cards"><div class="stat total"><div class="label">${tr('या महिन्याचा एकूण खर्च','Total this month')}</div><strong>${money(total)}</strong></div><div class="stat"><div class="label">${tr('मासिक बजेट','Monthly budget')}</div><strong>${db.budget?money(db.budget):tr('सेट केलेले नाही','Not set')}</strong></div><div class="stat"><div class="label">${tr('बजेट शिल्लक','Budget remaining')}</div><strong>${db.budget?money(db.budget-total):'—'}</strong></div><div class="stat"><div class="label">${tr('नोंदवलेले व्यवहार','Entries')}</div><strong>${monthCount()}</strong></div></div><div class="section-title"><h2>${tr('खर्च विभाग','Expense categories')}</h2><span class="pill">${monthName(month)}</span></div><div class="tiles">${icons.map(x=>`<button class="tile" onclick="openTab('${x[0]}')"><span class="emoji">${x[1]}</span><b>${tr(x[2],({किराणा:'Groceries',दूध:'Milk',सिलेंडर:'Gas',पेपर:'Newspaper','रोजचा खर्च':'Daily expense','इतर खर्च':'Other'})[x[2]])}</b><small>${money(x[3])}</small></button>`).join('')}</div><div class="panel"><div class="section-title"><h2>${tr('जलद नोंद','Quick entry')}</h2></div><div class="actions">${['daily','grocery','milk','gas','other'].map(t=>`<button class="secondary" onclick="openTab('${t}')">＋ ${titleOf(t)}</button>`).join('')}</div></div>`}function monthCount(){return ['groceries','milk','gas','paper','daily','other'].reduce((s,k)=>s+db[k].filter(x=>inMonth(x.date)).length,0)}function grocery(){return `<div class="section-title"><h2>🛒 ${titleOf('grocery')}</h2><span class="pill">${money(sums(db.groceries))}</span></div><div class="panel"><form onsubmit="addGrocery(event)"><div class="formgrid"><div class="field"><label>${tr('तारीख','Date')}</label><input name="date" type="date" value="${month}-01" required></div><div class="field"><label>${tr('दुकान / विक्रेता','Shop / Vendor')}</label><input name="shop" placeholder=""></div><div class="field"><label>${tr('वस्तू','Item')}</label><input name="item" placeholder="तांदूळ / Rice" required></div><div class="field"><label>${tr('प्रमाण','Quantity')}</label><input name="qty" placeholder="उदा. 5 किलो"></div><div class="field"><label>${tr('दर (₹)','Rate (₹)')}</label><input name="rate" type="number" min="0" step="0.01"></div><div class="field"><label>${tr('एकूण रक्कम (₹)','Amount (₹)')}</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>${tr('पैसे कोणी दिले?','Paid by')}</label><select name="member">${db.members.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div><div class="field"><label>${tr('टिप / बिल क्रमांक','Note / bill no.')}</label><input name="note"></div></div><button style="width:100%;margin-top:12px">＋ ${tr('किराणा नोंद जोडा','Add grocery')}</button></form></div>${listEntries(db.groceries,'grocery')}`}
function addGrocery(e){e.preventDefault();let f=new FormData(e.target),amount=+f.get('amount');db.groceries.push({id:Date.now(),date:f.get('date'),shop:f.get('shop'),item:f.get('item'),qty:f.get('qty'),rate:+f.get('rate')||0,amount,member:f.get('member'),note:f.get('note')});save();render()}
function milk(){let s=db.settings;return `<div class="section-title"><h2>🥛 ${titleOf('milk')}</h2><span class="pill">${money(sums(db.milk))}</span></div><div class="panel"><form onsubmit="addMilk(event)"><div class="formgrid"><div class="field"><label>${tr('तारीख','Date')}</label><input name="date" type="date" value="${month}-01" required></div><div class="field"><label>${tr('लिटर','Litres')}</label><input name="qty" type="number" step="0.1" value="${s.milkQty}" required></div><div class="field"><label>${tr('दर / लिटर (₹)','Rate / litre')}</label><input name="rate" type="number" step="0.01" value="${s.milkRate}" required></div><div class="field"><label>${tr('एकूण (₹)','Total (₹)')}</label><input name="amount" type="number" step="0.01" placeholder="${tr('ऑटो किंवा स्वतः भरा','Auto or enter')}" ></div><div class="field"><label>${tr('दूधवाला','Vendor')}</label><input name="vendor"></div><div class="field"><label>${tr('पैसे कोणी दिले?','Paid by')}</label><select name="member">${db.members.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div></div><button style="width:100%;margin-top:12px">＋ ${tr('दूध नोंद जोडा','Add milk record')}</button></form><p class="hint">${tr('रक्कम रिकामी ठेवल्यास लिटर × दर मोजला जाईल.','Leave amount blank to calculate litres × rate.')}</p></div>${listEntries(db.milk,'milk')}`}
function addMilk(e){e.preventDefault();let f=new FormData(e.target),q=+f.get('qty'),r=+f.get('rate'),amt=+f.get('amount')||q*r;db.milk.push({id:Date.now(),date:f.get('date'),qty:q,rate:r,amount:amt,vendor:f.get('vendor'),member:f.get('member')});save();render()}
function gas(){return `<div class="section-title"><h2>🔥 ${titleOf('gas')}</h2><span class="pill">${money(sums(db.gas))}</span></div><div class="panel"><form onsubmit="addGas(event)"><div class="formgrid"><div class="field"><label>${tr('बुकिंग तारीख','Booking date')}</label><input name="date" type="date" value="${month}-01" required></div><div class="field"><label>${tr('मिळाल्याची तारीख','Delivery date')}</label><input name="delivered" type="date"></div><div class="field"><label>${tr('किंमत (₹)','Price (₹)')}</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>${tr('एजन्सी','Agency')}</label><input name="vendor"></div><div class="field"><label>${tr('बुकिंग क्रमांक','Booking no.')}</label><input name="booking"></div><div class="field"><label>${tr('पैसे कोणी दिले?','Paid by')}</label><select name="member">${db.members.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div></div><button style="width:100%;margin-top:12px">＋ ${tr('सिलेंडर नोंद जोडा','Add cylinder')}</button></form></div>${listEntries(db.gas,'gas')}`}
function addGas(e){e.preventDefault();let f=new FormData(e.target);db.gas.push({id:Date.now(),date:f.get('date'),delivered:f.get('delivered'),amount:+f.get('amount'),vendor:f.get('vendor'),booking:f.get('booking'),member:f.get('member')});save();render()}
function paper(){return `<div class="section-title"><h2>📰 ${titleOf('paper')}</h2><span class="pill">${money(sums(db.paper))}</span></div><div class="panel"><form onsubmit="addPaper(event)"><div class="formgrid"><div class="field"><label>${tr('महिना','Month')}</label><input name="date" type="date" value="${month}-01" required></div><div class="field"><label>${tr('पेपरचे नाव','Newspaper')}</label><input name="name" placeholder=""></div><div class="field"><label>${tr('प्रति दिवस दर (₹)','Daily rate (₹)')}</label><input name="rate" type="number" step="0.01" value="${db.settings.paperRate}" required></div><div class="field"><label>${tr('दिवस','Days')}</label><input name="days" type="number" value="${db.settings.paperDays}" required></div><div class="field"><label>${tr('एकूण (₹)','Total (₹)')}</label><input name="amount" type="number" step="0.01"></div><div class="field"><label>${tr('पैसे कोणी दिले?','Paid by')}</label><select name="member">${db.members.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div><div class="field"><label>${tr('बाकी / टिप','Due / Note')}</label><input name="note"></div></div><button style="width:100%;margin-top:12px">＋ ${tr('पेपर नोंद जोडा','Add newspaper bill')}</button></form></div>${listEntries(db.paper,'paper')}`}
function addPaper(e){e.preventDefault();let f=new FormData(e.target),amt=+f.get('amount')||+f.get('rate')*+f.get('days');db.paper.push({id:Date.now(),date:f.get('date'),name:f.get('name'),rate:+f.get('rate'),days:+f.get('days'),amount:amt,member:f.get('member'),note:f.get('note')});save();render()}
function expenseForm(type){let arr=db[type],t=titleOf(type);return `<div class="section-title"><h2>${type==='daily'?'💸':'🏡'} ${t}</h2><span class="pill">${money(sums(arr))}</span></div><div class="panel"><form onsubmit="addExpense(event,'${type}')"><div class="formgrid"><div class="field"><label>${tr('तारीख','Date')}</label><input name="date" type="date" value="${month}-01" required></div><div class="field"><label>${tr('खर्चाचे नाव','Expense title')}</label><input name="title" placeholder="${tr('भाजी, औषधे, वीज बिल...','Vegetables, medicine, bill...')}" required></div><div class="field"><label>${tr('Category','Category')}</label><input name="category" placeholder="${tr('भाजी / प्रवास / बिल','Groceries / travel / bill')}"></div><div class="field"><label>${tr('रक्कम (₹)','Amount (₹)')}</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>${tr('पैसे कोणी दिले?','Paid by')}</label><select name="member">${db.members.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div><div class="field"><label>${tr('टिप','Note')}</label><input name="note"></div></div><button style="width:100%;margin-top:12px">＋ ${tr('खर्च जोडा','Add expense')}</button></form></div>${listEntries(arr,type)}`}
function addExpense(e,type){e.preventDefault();let f=new FormData(e.target);db[type].push({id:Date.now(),date:f.get('date'),title:f.get('title'),category:f.get('category'),amount:+f.get('amount'),member:f.get('member'),note:f.get('note')});save();render()}
function listEntries(arr,type){let rows=arr.filter(x=>inMonth(x.date)).sort((a,b)=>b.date.localeCompare(a.date));if(!rows.length)return `<div class="panel empty">${tr('या महिन्यात नोंद नाही. वरून पहिली नोंद जोडा.','No entries this month. Add your first entry above.')}</div>`;return `<div class="section-title"><h2>${tr('या महिन्याच्या नोंदी','This month entries')}</h2></div><div class="list">${rows.map(x=>`<div class="entry"><div><b>${esc(x.item||x.title||x.name||tr('नोंद','Entry'))}</b><div class="sub">${x.date||''}${x.qty?' · '+esc(x.qty):''}${x.shop?' · '+esc(x.shop):''}${x.vendor?' · '+esc(x.vendor):''}${x.category?' · '+esc(x.category):''}${x.member?' · '+esc(x.member):''}</div>${x.note?`<div class="sub">${esc(x.note)}</div>`:''}</div><div class="amount">${money(x.amount)}<br><button class="danger small" onclick="deleteEntry('${type}',${x.id})">${tr('हटवा','Delete')}</button></div></div>`).join('')}</div>`}function deleteEntry(type,id){if(confirm(tr('ही नोंद हटवायची?','Delete this entry?'))){db[type]=db[type].filter(x=>x.id!==id);save();render()}}
function reports(total){let cats=[['groceries','🛒',db.groceries],['milk','🥛',db.milk],['gas','🔥',db.gas],['paper','📰',db.paper],['daily','💸',db.daily],['other','🏡',db.other]];return `<div class="section-title"><h2>📊 ${titleOf('reports')}</h2><span class="pill">${monthName(month)}</span></div><div class="panel report-head"><h2>${tr('घरगुती मासिक खर्च','Monthly Household Report')}</h2><p>${monthName(month)}</p><h1>${money(total)}</h1></div><div class="panel">${cats.map(c=>`<div class="entry"><div>${c[1]} ${titleOf(c[0])}<div class="sub">${c[2].filter(x=>inMonth(x.date)).length} ${tr('नोंदी','records')}</div></div><b>${money(sums(c[2]))}</b></div>`).join('')}<div class="divider"></div><div class="entry"><b>${tr('एकूण','Total')}</b><strong>${money(total)}</strong></div></div><div class="panel"><div class="actions"><button onclick="printReport()">🖨️ ${tr('PDF / Print रिपोर्ट','PDF / Print report')}</button><button class="secondary" onclick="exportCSV()">⬇ CSV</button><button class="secondary" onclick="exportBackup()">⬇ Backup JSON</button></div><p class="hint">${tr('PDF सेव्ह करण्यासाठी Print उघडून Destination मध्ये Save as PDF निवडा.','To save PDF, choose Save as PDF in the print destination.')}</p></div>`}
function printReport(){let total=sums(db.groceries)+sums(db.milk)+sums(db.gas)+sums(db.paper)+sums(db.daily)+sums(db.other);let sections=[['किराणा',db.groceries],['दूध',db.milk],['सिलेंडर',db.gas],['पेपर',db.paper],['रोजचा खर्च',db.daily],['इतर खर्च',db.other]];let html=`<html><head><title>HomeLedger Report</title><style>body{font-family:Arial;padding:24px}h1{text-align:center}table{width:100%;border-collapse:collapse;margin:12px 0}td,th{border:1px solid #ddd;padding:8px;text-align:left}h2{margin-top:25px}.bottom{max-width:850px;margin-left:auto;margin-right:auto;left:10px;right:10px}.bottom button{min-height:48px}@media(min-width:650px){.bottom{left:calc(50% - 425px);right:calc(50% - 425px)}}
</style></head><body><h1>घरहिशोब · HomeLedger</h1><h2 style="text-align:center">${monthName(month)} · मासिक रिपोर्ट</h2><h2 style="text-align:center">एकूण खर्च: ₹${total.toFixed(2)}</h2>`;sections.forEach(([name,arr])=>{let list=arr.filter(x=>inMonth(x.date));html+=`<h2>${name} — ₹${sums(arr).toFixed(2)}</h2><table><tr><th>तारीख</th><th>विवरण</th><th>प्रमाण</th><th>पैसे दिले</th><th>रक्कम</th></tr>${list.map(x=>`<tr><td>${x.date||''}</td><td>${x.item||x.title||x.name||''} ${x.shop||x.vendor||''} ${x.category||''}</td><td>${x.qty||x.days||''}</td><td>${x.member||''}</td><td>₹${Number(x.amount||0).toFixed(2)}</td></tr>`).join('')}</table>`});html+='</body></html>';let w=window.open('','_blank');if(!w){alert(tr('पॉप-अप ब्लॉक झाला. ब्राउझरमध्ये pop-up allow करा.','Pop-up blocked. Allow pop-ups in browser.'));return}w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),500)}
function historyPage(){let months=new Set();['groceries','milk','gas','paper','daily','other'].forEach(k=>db[k].forEach(x=>months.add((x.date||'').slice(0,7))));let list=[...months].filter(Boolean).sort().reverse();return `<div class="section-title"><h2>📅 ${titleOf('history')}</h2></div><div class="panel"><div class="field"><label>${tr('महिना निवडा','Select month')}</label><input type="month" value="${month}" onchange="setMonth(this.value)"></div><button style="width:100%;margin-top:10px" onclick="openTab('reports')">${tr('या महिन्याचा रिपोर्ट उघडा','Open report for selected month')}</button></div><div class="list">${list.length?list.map(m=>`<div class="entry" onclick="setMonth('${m}');openTab('reports')"><div><b>${monthName(m)}</b><div class="sub">${tr('महिन्याचा हिशोब पाहण्यासाठी टॅप करा','Tap to view monthly details')}</div></div><span>›</span></div>`).join(''):`<div class="panel empty">${tr('अजून इतिहास नाही. खर्च नोंदवल्यावर महिने दिसतील.','History will appear after you add expenses.')}</div>`}</div>`}
function settingsBase(){let dis=editMode?'':'disabled';return `<div class="section-title"><h2>⚙️ ${titleOf('settings')}</h2><span class="pill">${editMode?'🔓 EDIT':'🔒 LOCKED'}</span></div><div class="panel"><b>${editMode?tr('एडिट मोड सुरू आहे','Edit mode is ON'):tr('सेटिंग लॉक आहेत','Settings are locked')}</b><p class="hint">${editMode?tr('बदल सेव्ह केल्यावर लॉक होईल.','Saving changes will lock settings again.'):tr('सेटिंगच्या ⚙️ बटणावर 0.75 सेकंद Long Press करून अनलॉक करा.','Long press Settings ⚙️ for 0.75 seconds to unlock.')}</p></div><div class="panel"><h3>${tr('घरातील सदस्य','Household members')}</h3><div class="row"><div class="field"><label>${tr('नवीन सदस्याचे नाव','Member name')}</label><input id="memberNew" ${dis}></div><button onclick="addMember()" ${dis}>＋ ${tr('जोडा','Add')}</button></div><div class="list" style="margin-top:10px">${db.members.map((m,i)=>`<div class="entry"><b>${esc(m)}</b><button class="danger small" onclick="removeMember(${i})" ${dis}>${tr('हटवा','Remove')}</button></div>`).join('')}</div></div><div class="panel"><h3>${tr('मासिक बजेट','Monthly budget')}</h3><div class="field"><label>${tr('बजेट रक्कम (₹)','Budget amount (₹)')}</label><input id="budgetInput" ${dis} type="number" step="1" value="${db.budget}"></div><button style="width:100%;margin-top:10px" onclick="saveBudget()" ${dis}>${tr('बजेट सेव्ह करा','Save budget')}</button></div><div class="panel"><h3>${tr('Backup / Restore','Backup / Restore')}</h3><div class="actions"><button onclick="exportBackup()">⬇ ${tr('Backup डाउनलोड','Download backup')}</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">⬆ ${tr('Restore Backup','Restore backup')}</button><input id="restoreFile" ${dis} type="file" accept="application/json" class="hidden" onchange="restoreBackup(event)"></div><p class="hint">${tr('डेटा या ब्राउझरमध्ये सेव्ह होतो. नियमित Backup डाउनलोड करून सुरक्षित ठेवा.','Data is saved in this browser. Download backups regularly.')}</p><button class="danger" onclick="resetData()" ${dis}>${tr('संपूर्ण डेटा हटवा','Delete all data')}</button></div><div class="panel"><h3>${tr('दूध व पेपर Default सेटिंग','Milk & newspaper defaults')}</h3><div class="formgrid"><div class="field"><label>${tr('दूध दर / लिटर','Milk rate per litre')}</label><input id="milkRate" ${dis} type="number" value="${db.settings.milkRate}"></div><div class="field"><label>${tr('दैनिक दूध प्रमाण (लिटर)','Daily milk quantity (L)')}</label><input id="milkQty" ${dis} type="number" step="0.1" value="${db.settings.milkQty}"></div><div class="field"><label>${tr('पेपर दर / दिवस','Newspaper rate per day')}</label><input id="paperRate" ${dis} type="number" value="${db.settings.paperRate}"></div><div class="field"><label>${tr('पेपर दिवस','Newspaper days')}</label><input id="paperDays" ${dis} type="number" value="${db.settings.paperDays}"></div></div><button style="width:100%;margin-top:10px" onclick="saveDefaults()" ${dis}>${tr('सेटिंग सेव्ह','Save defaults')}</button></div>`}
function addMember(){if(!editMode)return;let n=document.getElementById('memberNew').value.trim();if(n&&!db.members.includes(n)){db.members.push(n);save();editMode=false;render()}}function removeMember(i){if(!editMode)return;if(db.members.length<=1){alert(tr('किमान एक सदस्य आवश्यक आहे.','Keep at least one member.'));return}db.members.splice(i,1);save();editMode=false;render()}function saveBudget(){if(!editMode)return;db.budget=+document.getElementById('budgetInput').value||0;save();editMode=false;render()}function saveDefaults(){if(!editMode)return;db.settings.milkRate=+document.getElementById('milkRate').value||0;db.settings.milkQty=+document.getElementById('milkQty').value||0;db.settings.paperRate=+document.getElementById('paperRate').value||0;db.settings.paperDays=+document.getElementById('paperDays').value||0;save();editMode=false;alert(tr('सेटिंग सेव्ह झाली आणि लॉक झाले.','Settings saved and locked.'));render()}function exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HomeLedger-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}function restoreBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let parsed=JSON.parse(r.result);if(!parsed.members||!parsed.groceries)throw 0;db=parsed;save();render();alert(tr('Backup Restore झाला!','Backup restored!'))}catch{alert(tr('ही वैध HomeLedger Backup फाईल नाही.','Invalid HomeLedger backup file.'))}};r.readAsText(file)}function resetData(){if(!editMode)return;if(confirm(tr('संपूर्ण डेटा कायमचा हटवायचा आहे? आधी Backup घ्या.','Permanently delete all data? Back up first.'))){db=structuredClone(defaults);save();editMode=false;render()}}function exportCSV(){let all=[];for(let k of ['groceries','milk','gas','paper','daily','other'])for(let x of db[k].filter(x=>inMonth(x.date)))all.push([k,x.date,x.item||x.title||x.name||'',x.qty||'',x.category||'',x.member||'',x.amount||0,x.note||'']);let csv='Type,Date,Description,Quantity,Category,Paid by,Amount,Note\n'+all.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HomeLedger-'+month+'.csv';a.click();URL.revokeObjectURL(a.href)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=document.getElementById('installBtn');if(b)b.classList.remove('hidden')});async function installApp(){if(!installPrompt){alert(lang==='mr'?'Chrome मेनूमधून “Install app” किंवा “Add to Home screen” निवडा.':'Use Chrome menu and choose “Install app” or “Add to Home screen”.');return}installPrompt.prompt();const result=await installPrompt.userChoice;installPrompt=null;const b=document.getElementById('installBtn');if(b)b.classList.add('hidden')}window.addEventListener('appinstalled',()=>{const b=document.getElementById('installBtn');if(b)b.classList.add('hidden')});render();if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});

/* ===== Security lock (PIN + picture) ===== */
const LK='homeledger_lock_v1';
let lk=(()=>{try{return JSON.parse(localStorage.getItem(LK))||{}}catch{return{}}})();
function lkSave(){try{localStorage.setItem(LK,JSON.stringify(lk));return true}catch{alert(tr('जागा कमी आहे. लहान फोटो निवडा.','Storage full. Choose a smaller photo.'));return false}}
async function hashPin(p){const s=(lk.salt||'')+':'+p;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h}
let pad={buf:'',mode:'unlock',tmp:'',cb:null,msg:''},fails=0,lockUntil=0,hiddenAt=0;
(function(){const k=document.getElementById('lkPad');k.innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(x=>x===''?'<span></span>':`<button type="button" onclick="padKey('${x==='⌫'?'<':x}')">${x}</button>`).join('')})();
function showPad(mode,cb){pad={buf:'',mode,tmp:'',cb,msg:''};document.getElementById('lockScreen').classList.remove('hidden');drawPad()}
function hidePad(){document.getElementById('lockScreen').classList.add('hidden')}
function drawPad(){const T={unlock:tr('PIN टाका','Enter PIN'),verify:tr('सध्याचा PIN टाका','Enter current PIN'),new1:tr('नवीन ४ अंकी PIN टाका','Enter new 4-digit PIN'),new2:tr('PIN पुन्हा टाका','Re-enter PIN')};
document.getElementById('lkPic').innerHTML=lk.img?`<img src="${lk.img}" alt="">`:'🏠';
document.getElementById('lkTitle').textContent=T[pad.mode];
document.getElementById('lkDots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<pad.buf.length?'on':''}"></i>`).join('');
document.getElementById('lkMsg').textContent=pad.msg||'';
const c=document.getElementById('lkCancel');c.textContent=tr('रद्द करा','Cancel');c.classList.toggle('hidden',pad.mode==='unlock')}
function padKey(k){if(Date.now()<lockUntil){pad.msg=tr('थोड्या वेळाने प्रयत्न करा','Try again shortly');drawPad();return}pad.msg='';if(k==='<')pad.buf=pad.buf.slice(0,-1);else if(pad.buf.length<4)pad.buf+=k;drawPad();if(pad.buf.length===4)setTimeout(padDone,100)}
function wrongPad(msg){const d=document.getElementById('lkDots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');pad.buf='';pad.msg=msg;if(navigator.vibrate)navigator.vibrate(120)}
async function padDone(){const p=pad.buf;
if(pad.mode==='unlock'||pad.mode==='verify'){if(await hashPin(p)===lk.hash){fails=0;const cb=pad.cb;hidePad();if(cb)cb();return}fails++;if(fails>=5){fails=0;lockUntil=Date.now()+30000;wrongPad(tr('५ वेळा चुकीचा PIN. ३० सेकंद थांबा.','5 wrong tries. Wait 30 seconds.'))}else wrongPad(tr('चुकीचा PIN','Wrong PIN'))}
else if(pad.mode==='new1'){pad.tmp=p;pad.mode='new2';pad.buf=''}
else if(pad.mode==='new2'){if(p===pad.tmp){lk.salt=Math.random().toString(36).slice(2);lk.hash=await hashPin(p);if(lkSave()){hidePad();render();alert(tr('PIN सेट झाला. तो लक्षात ठेवा!','PIN saved. Remember it!'));return}}else{pad.mode='new1';wrongPad(tr('PIN जुळला नाही. पुन्हा प्रयत्न करा.','PINs did not match. Try again.'))}}
drawPad()}
function pinSet(){lk.hash?showPad('verify',()=>showPad('new1')):showPad('new1')}
function pinRemove(){showPad('verify',()=>{delete lk.hash;lkSave();render();alert(tr('PIN लॉक बंद केला.','PIN lock removed.'))})}
function pickLockImg(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=480,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);lk.img=c.toDataURL('image/jpeg',.8);if(lkSave())render()};im.onerror=()=>alert(tr('फोटो उघडता आला नाही.','Could not open photo.'));im.src=r.result};r.readAsDataURL(f)}
function rmLockImg(){delete lk.img;lkSave();render()}
function securityPanel(){const on=!!lk.hash;return `<div class="panel"><h3>🔐 ${tr('सुरक्षा लॉक','Security lock')}</h3><p class="hint">${on?tr('PIN लॉक चालू आहे. ॲप उघडताना आणि ३० सेकंद बाहेर राहिल्यावर PIN लागेल.','PIN lock is ON. Asked on open and after 30 seconds away.'):tr('PIN लॉक बंद आहे.','PIN lock is OFF.')}</p><div class="row"><button type="button" onclick="pinSet()">${on?tr('PIN बदला','Change PIN'):tr('PIN सेट करा','Set PIN')}</button>${on?`<button type="button" class="secondary" onclick="pinRemove()">${tr('PIN काढा','Remove PIN')}</button>`:''}</div><h3 style="margin-top:14px">🖼️ ${tr('लॉक स्क्रीन फोटो','Lock screen photo')}</h3><input id="lockImg" type="file" accept="image/*" class="hidden" onchange="pickLockImg(event)"><div class="row"><button type="button" onclick="document.getElementById('lockImg').click()">${tr('फोटो निवडा','Choose photo')}</button>${lk.img?`<button type="button" class="secondary" onclick="rmLockImg()">${tr('फोटो काढा','Remove photo')}</button>`:''}</div>${lk.img?`<p><img src="${lk.img}" alt="" style="width:80px;height:80px;border-radius:50%;object-fit:cover"></p>`:''}<p class="hint">${tr('PIN विसरलात तर ब्राउझर डेटा क्लिअर करावा लागेल आणि सर्व माहिती जाईल. म्हणून नियमित Backup घ्या.','If you forget the PIN, clearing browser data is the only way and all data is lost. Take regular backups.')}</p></div>`}
function settings(){return settingsBase()+securityPanel()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now()}else if(lk.hash&&hiddenAt&&Date.now()-hiddenAt>30000&&document.getElementById('lockScreen').classList.contains('hidden')){showPad('unlock')}});
if(lk.hash)showPad('unlock');
</script></body></html>
